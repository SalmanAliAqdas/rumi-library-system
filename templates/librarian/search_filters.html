{% load library_ui %}
<form class="filters" role="search">
<label class="sr-only" for="q">{% ui 'search' %}</label><input id="q" type="search" name="q" maxlength="200" value="{{ search_form.q.value|default:'' }}" placeholder="{% ui 'placeholder' %}">
<label class="sr-only" for="category">{% ui 'categories' %}</label><select id="category" name="category"><option value="">{% ui 'all_subjects' %}</option>{% for category in categories %}<option value="{{ category.slug }}" {% if search_form.category.value == category.slug %}selected{% endif %}>{{ category.display_name }}</option>{% endfor %}</select>
<label class="sr-only" for="language">{% ui 'languages' %}</label><select id="language" name="language"><option value="">{% ui 'all_languages' %}</option>{% for language in languages %}<option value="{{ language.code }}" {% if search_form.language.value == language.code %}selected{% endif %}>{{ language.name }}</option>{% endfor %}</select>
<label class="sr-only" for="availability">{% ui 'availability' %}</label><select id="availability" name="availability">{% for value, name in search_form.availability.field.choices %}<option value="{{ value }}" {% if search_form.availability.value == value %}selected{% endif %}>{{ name }}</option>{% endfor %}</select>
{% if management_filters %}<label class="sr-only" for="shelf">{% ui 'shelf' %}</label><select id="shelf" name="shelf"><option value="">{% ui 'all_shelves' %}</option>{% for shelf in shelves %}<option value="{{ shelf.pk }}" {% if search_form.shelf.value == shelf.pk|stringformat:'s' %}selected{% endif %}>{{ shelf.label }}</option>{% endfor %}</select><label class="sr-only" for="visibility">{% ui 'visibility' %}</label><select id="visibility" name="visibility">{% for value, name in search_form.visibility.field.choices %}<option value="{{ value }}" {% if search_form.visibility.value == value %}selected{% endif %}>{{ name }}</option>{% endfor %}</select>{% endif %}
{% if display_mode %}<input type="hidden" name="display" value="1">{% endif %}<button>{% ui 'filter' %}</button>
</form>
{% if search_form.errors %}<div class="error-summary" role="alert">{% ui 'errors' %}{{ search_form.errors }}</div>{% endif %}
